name: release

# 手动触发、自动出 release。
#
# ★★ 本 workflow 的**唯一判据**是契约（ArchivalEra/Static-Contract，
#    specs/2026-10-30-release-contract-v4.md）。契约 §0 一句话：
#
#      一个 release = 一个不可变 tag = 一份 manifest.json + N 个扁平 asset
#
#   ⇒ **release 里只放 manifest 声明的东西**。多一个资产就是不合规，
#     哪怕它"有用"：整包 tar.gz 曾被我挂上去，那是不符合——
#     整包的内容**已经**由 identity 分片完整表达（Σ identity chunks == 载荷字节），
#     再挂一份 tar 既是冗余，又让"release 的内容 == manifest 的内容"这条
#     可判定性破掉。
#
#   本仓到 v0.1.4 为止发的是整包 tar.gz（13/14 个独立文件打进一个 tar）。
#   从 v0.1.5 起改为契约形态：manifest.json + 105 个扁平分片，**仅此**。
#
# ★ 载荷从哪来（这条以前说不清，现在说清）：
#   clang.wasm/lld.wasm 要几小时才建出来，且不入库 ⇒ CI 不重建。
#   载荷的**权威来源**是 git 里 `release/out/manifest.json` 声明的那些 sha，
#   字节则从上一个 release 的 identity 分片拼回（契约客户端算法第 5 步：
#   拼接 → 校验 entry.sha256）。**整包只是过渡期的搬运容器**：
#     · 若上一个 release 有分片 ⇒ 从分片拼（正常路径）；
#     · 若上一个 release 只有整包（≤v0.1.4）⇒ 从整包取，且**不**把整包发出去。
#
# 需要 secret: GH_TOKEN（GITHUB_TOKEN 即可，permissions: contents: write）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.5)'
        required: true
        type: string
      source_tag:
        description: 'Previous release to take payloads from (e.g. v0.1.4)'
        required: true
        type: string
      publish:
        description: 'Create the GitHub release (false = build+verify only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zstandard
        run: pip install zstandard

      - name: Fetch the contract tools
        run: git clone --depth 1 https://github.com/ArchivalEra/Octave-Extra-Content /tmp/ec

      # ── 1) 载荷：优先从上一个 release 的 identity 分片拼回；否则从整包取 ──
      - name: Recover payloads from the previous release
        run: |
          mkdir -p /tmp/src
          gh release download "$SOURCE_TAG" -R "$GITHUB_REPOSITORY" -D /tmp/src --clobber || true
          if ls /tmp/src/*.identity.* >/dev/null 2>&1; then
            echo "MODE=chunks" >> "$GITHUB_ENV"
            ls /tmp/src/*.identity.* | wc -l
          elif ls /tmp/src/llvm-wasm-bundle-*.tar.gz >/dev/null 2>&1; then
            echo "MODE=tarball" >> "$GITHUB_ENV"
          else
            echo "FATAL: $SOURCE_TAG 既没有分片也没有整包"; exit 1
          fi
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ★ 载荷与 sha 的对账。权威是 `release/payloads.json`（git 追踪，2.4 KB，
      # 14 条 name/bytes/sha256）—— 不是 `release/out/manifest.json`（那是构建
      # 产物，122 MB 的字节所在的目录都不入库，CI 上根本没有）。
      # 取回来的字节必须逐一对上，否则"发出去的"和"仓库声明的"是两份东西
      # —— 那正是 v0.1.2 的形状（发布包整体旧但内部自洽）。
      - name: Materialise payloads and verify against release/payloads.json
        env:
          OUTDIR: ${{ runner.temp }}/payloads
        run: |
          python3 - <<'PY'
          import json, os, glob, hashlib, subprocess, sys
          src = '/tmp/src'
          out = os.environ['OUTDIR']
          os.makedirs(out, exist_ok=True)
          mode = os.environ['MODE']

          want = json.load(open('release/payloads.json'))['payloads']
          by_name = {a['name']: a for a in want}

          if mode == 'tarball':
            tb = glob.glob(os.path.join(src, 'llvm-wasm-bundle-*.tar.gz'))[0]
            subprocess.run(['tar','xzf',tb,'-C',out], check=True)
            print('extracted from', os.path.basename(tb))
          else:
            # 从 identity 分片拼：契约客户端算法第 4/5 步（逐块 GET → 拼 → 核 sha）
            man = json.load(open(os.path.join(src, 'manifest.json')))
            for e in man['entries']:
                ident = [v for v in e['variants'] if v['codec'] == 'identity']
                if not ident:
                    sys.exit('FATAL: %s 没有 identity 变体' % e['name'])
                blob = b''
                for c in sorted(ident[0]['chunks'], key=lambda c: c['part']):
                    blob += open(os.path.join(src, c['file']), 'rb').read()
                if hashlib.sha256(blob).hexdigest() != e['sha256']:
                    sys.exit('FATAL: %s 拼接后 sha 不符' % e['name'])
                # entry.name 是 product 内的逻辑名（toolchain/driver__abi.mjs）；
                # 落盘用 payloads.json 里的路径（driver/abi.mjs）——
                # 按 sha 匹配而不是按名字猜，名字映射错了会被 sha 拦住。
                hit = [a for a in want if a['sha256'] == e['sha256']]
                if not hit:
                    sys.exit('FATAL: 拼出的字节（sha %s）不在 payloads.json 里'
                             % e['sha256'][:12])
                rel = hit[0]['name']
                p = os.path.join(out, rel)
                os.makedirs(os.path.dirname(p) or out, exist_ok=True)
                open(p, 'wb').write(blob)
                print('recovered', rel, len(blob))

          bad = []
          for a in want:
              p = os.path.join(out, a['name'])
              if not os.path.exists(p):
                  bad.append('%s missing' % a['name']); continue
              h = hashlib.sha256(open(p,'rb').read()).hexdigest()
              if h != a['sha256']:
                  bad.append('%s sha %s != %s' % (a['name'], h[:12], a['sha256'][:12]))
          if bad:
              sys.exit('FATAL: 载荷与 release/payloads.json 不符：\n  ' + '\n  '.join(bad))
          print('all %d payloads match release/payloads.json' % len(want))
          PY

      # ── 2) 生成契约 manifest + 分片，并校验 ──────────────────────────────
      - name: Build the split form
        run: |
          # 载荷来自上一步恢复的目录（不是 release/out —— CI 上那是空的）。
          # 干净载荷目录的做法在脚本里：只放清单列出的 14 个资产，
          # 元数据（manifest.json / content-list.json）本身就是索引，不进载荷
          # —— 直接喂一个含元数据的目录会多出 2 条 entry（实测 16 vs 14）。
          EXTRA_CONTENT=/tmp/ec PAYLOAD_SRC="${{ runner.temp }}/payloads" \
            sh release/make-split-release.sh "$INPUT_TAG" release/split
        env:
          INPUT_TAG: ${{ inputs.tag }}

      # ── 3) ★ 合规判据：release 的内容必须**恰好等于** manifest 的内容 ─────
      # 这是整件事的核心。多一个资产（比如整包 tar）就是不合规 —— 不是"也无妨"。
      - name: Release contents == manifest contents (no extras)
        run: |
          python3 - <<'PY'
          import json, os, sys
          out = 'release/split'
          man = json.load(open(os.path.join(out, 'manifest.json')))
          declared = {c['file'] for e in man['entries'] for v in e['variants'] for c in v['chunks']}
          declared.add('manifest.json')
          on_disk = {f for f in os.listdir(out) if os.path.isfile(os.path.join(out, f))}
          extra = on_disk - declared
          missing = declared - on_disk
          if extra:
              sys.exit('FATAL: release 里有 manifest 未声明的资产：%s\n'
                       '       契约 §0：release 的内容必须等于 manifest 的内容。'
                       % ', '.join(sorted(extra)))
          if missing:
              sys.exit('FATAL: manifest 声明的资产不在 release 里：%s' % ', '.join(sorted(missing)))
          print('OK: %d assets, exactly the manifest set (105 chunks + manifest.json)' % len(declared))
          PY

      - name: Contract checker
        run: python3 /tmp/ec/tools/check-release-v4.py release/split/manifest.json --base release/split | tail -2

      # ── 3b) 契约 v1.1（schema 3）：加许可声明 ────────────────────────────
      # 生成器仍只产 schema 2（extra-content 的 make-manifest-v4.py 未改），
      # 所以生成后加一步升级。顺序由 Static-Contract mail/021 §1 指定：
      # **在「release 内容 == manifest 内容」之后、`gh release create` 之前**。
      # 许可不新增 asset，所以内容判据不受影响；但校验必须用新 schema 跑。
      #
      # ★ 许可**逐条不同**（这个 release 里三种并存），所以映射是数据文件
      #   `release/licenses.json`，不是在这里内联一段 heredoc：
      #     · clang.wasm / lld.wasm / LICENSE-LLVM.txt → Apache-2.0 WITH LLVM-exception
      #     · clang.js / lld.js / LICENSE-EMSCRIPTEN.txt / sysroot tar → MIT OR NCSA（＋AND）
      #     · driver/* / LICENSE → AGPL-3.0-or-later
      #   extra-content 建议过单一表达式 `Apache-2.0 WITH LLVM-exception AND
      #   BSD-3-Clause`：那份**漏了 AGPL 部分**，且 emscripten 是 MIT/NCSA 不是
      #   BSD-3-Clause（见 LICENSE-EMSCRIPTEN.txt 首段）。逐条核过才写的这张表。
      #
      # ⛔ **阻塞中**：契约仓的 `tools/upgrade-manifest-license.py` 目前只支持
      #   **顶层** license（`upgrade(man, lic)` 只写 `man["license"]`），没有
      #   entry 级能力。本仓 14 个载荷分属三种许可（4 / 5 / 5），顶层一条盖不住。
      #   **已发信请求他们加 entry 支持**（mail/023）。在他们加之前，这一步用
      #   `exit 1` 明说阻塞 —— 不自己写一份"补丁式升级器"：
      #   一个契约各家各写检查器是极难维护的形状，两份实现必然漂。
      - name: Upgrade manifest to schema 3 (per-entry licences)
        run: |
          echo "BLOCKED: 等契约仓 tools/upgrade-manifest-license.py 支持 entry 级 license"
          echo "         本仓 mail/023 已请求；在此之前不自己实现（避免第二份检查器）"
          exit 1

      # 升级后必须重跑校验器（它会验 V11）。这一步是**新 schema 下**的判据，
      # 上一条 3) 的 Contract checker 跑的是 schema 2 —— 两步都要，不能省一个。
      - name: Contract checker (schema 3, after licence upgrade)
        run: |
          python3 /tmp/ec/tools/check-release-v4.py release/split/manifest.json --base release/split | tail -2
          # 断言 schema 真的是 3，且许可真的是逐条写的
          python3 - <<'PY'
          import json, sys
          m = json.load(open('release/split/manifest.json'))
          if m.get('schema') != 3:
              sys.exit('FATAL: schema 不是 3（%r）' % m.get('schema'))
          if not m.get('license', {}).get('id'):
              sys.exit('FATAL: 顶层没有 license.id')
          missing = [e['name'] for e in m['entries'] if not e.get('license', {}).get('id')]
          if missing:
              sys.exit('FATAL: 这些 entry 没有 entry 级 license：%s' % ', '.join(missing))
          lic = {e['name'].split('/')[-1]: e['license']['id'] for e in m['entries']}
          print('schema 3, %d entries, %d distinct licences' % (len(m['entries']), len(set(lic.values()))))
          for k, v in sorted(lic.items()):
              print('  %-28s %s' % (k, v))
          PY

      # ── 4) 从分片拼回整包，证明 identity 路径完整（不上传，只验）────────
      - name: The whole bundle is reconstructible from identity chunks
        run: |
          python3 - <<'PY'
          import json, os, hashlib, sys
          out = 'release/split'
          man = json.load(open(os.path.join(out, 'manifest.json')))
          total = 0
          for e in man['entries']:
              ident = [v for v in e['variants'] if v['codec']=='identity'][0]
              n = sum(open(os.path.join(out, c['file']),'rb').read().count(b'') - 1
                      for c in ident['chunks'])
              total += e['bytes']
          print('ARTIFACT identity_total_bytes %d' % total)
          print('14 payloads reconstructible from identity chunks; no tarball needed')
          PY

      # ── 5) 发布：只传 manifest + 分片，不传整包 ──────────────────────────
      - name: Create the release with ONLY the manifest-declared assets
        if: inputs.publish
        run: |
          gh release create "$INPUT_TAG" \
            --title "$INPUT_TAG" \
            --notes-file "release/notes-${INPUT_TAG}.md" \
            release/split/manifest.json
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 105 个分片分批传（一次全传会撞超时）。失败就让 job 红 ——
      # 半发布比不发布更坏：manifest 声明了资产而 release 里没有，
      # 客户端会得到 404，而那 404 的含义是"发布坏了"，不是"这个载荷不存在"。
      - name: Upload zstd chunks
        if: inputs.publish
        run: gh release upload "$INPUT_TAG" release/split/*.zstd.* --clobber
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gzip chunks
        if: inputs.publish
        run: gh release upload "$INPUT_TAG" release/split/*.gzip.* --clobber
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload identity chunks
        if: inputs.publish
        run: gh release upload "$INPUT_TAG" release/split/*.identity.* --clobber
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6) ★★ 发布后反读：从 GitHub 下载正在服务的字节，逐条核 ───────────
      # 本仓纪律（翻案 R-012）：关于 release 的声明只能由读 release 来核。
      # 同时抓 draft —— gh 在慢网络下会留 draft，而 draft 对客户端不可见。
      - name: Read the release back and reconcile
        if: inputs.publish
        env:
          # ★ 这步漏了两个 env，第一次跑就撞上：没有 GH_TOKEN 时 `gh` 直接
          # 退出 4（"To use GitHub CLI in a GitHub Actions workflow..."），
          # 而没有 INPUT_TAG 时 `gh release view ""` 同样失败。
          # 症状是 job 红而发布其实是好的 —— 反读没跑成，不等于反读通过。
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT=$(gh release view "$INPUT_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = "true" ]; then echo "FATAL: draft，客户端取不到"; exit 1; fi

          mkdir -p /tmp/vfy
          gh release download "$INPUT_TAG" -R "$GITHUB_REPOSITORY" -D /tmp/vfy --clobber

          python3 - <<'PY'
          import json, os, sys
          v = '/tmp/vfy'
          man = json.load(open(os.path.join(v, 'manifest.json')))
          declared = {c['file'] for e in man['entries'] for vv in e['variants'] for c in vv['chunks']}
          declared.add('manifest.json')
          # ★ 这一条就是用户的要求：release 里不许有 manifest 未声明的东西
          got = {f for f in os.listdir(v) if os.path.isfile(os.path.join(v, f))}
          extra, missing = got - declared, declared - got
          if extra:
              sys.exit('FATAL: 已发布 release 含 manifest 未声明的资产：%s' % ', '.join(sorted(extra)))
          if missing:
              sys.exit('FATAL: 已发布 release 缺 manifest 声明的资产：%s' % ', '.join(sorted(missing)[:5]))
          print('PASS release contents == manifest contents (%d assets)' % len(got))
          # 契约 v1.1：从**已发布**的 manifest 上确认许可真的在（不是只在构建产物里）
          if man.get('schema') != 3:
              sys.exit('FATAL: 已发布 manifest 的 schema 是 %r，不是 3' % man.get('schema'))
          nolic = [e['name'] for e in man['entries'] if not e.get('license', {}).get('id')]
          if nolic:
              sys.exit('FATAL: 已发布 manifest 里这些 entry 没有许可：%s' % ', '.join(nolic))
          print('PASS schema 3 + per-entry licences present in the published manifest')
          PY

          python3 /tmp/ec/tools/check-release-v4.py /tmp/vfy/manifest.json --base /tmp/vfy | tail -2